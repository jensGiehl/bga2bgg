spring.application.name=Bga2Bgg

spring.main.banner-mode=off

# UI language: English is the default, German is available via ?lang=de.
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Mapping of BGA usernames to the real names printed in the output.
# Bracket notation preserves the exact (case sensitive) username.
# Unknown usernames are printed as "BGA User <username>".
bga.player-mapping[Example]=Example-Name
