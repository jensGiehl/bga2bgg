name: Release

# release-please beobachtet die Conventional Commits auf main und pflegt
# fortlaufend einen "Release PR" (Versions-Bump in pom.xml + CHANGELOG.md).
# Erst beim Mergen dieses PRs entstehen Tag + GitHub Release — danach bauen
# die publish-Jobs das JAR bzw. das versionierte Docker-Image.
on:
  push:
    branches:
      - main

permissions:
  contents: write        # Tags & Releases anlegen
  pull-requests: write   # Release-PR anlegen/aktualisieren

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Liest release-please-config.json + .release-please-manifest.json.
      - uses: googleapis/release-please-action@v4
        id: rp

  # Läuft nur, wenn der Release-PR gemergt und ein Release erstellt wurde.
  # (Im selben Workflow-Run getriggert — daher greift die GITHUB_TOKEN-Sperre
  #  gegen kaskadierende Tag-Events nicht, es braucht keinen PAT.)
  publish-jar:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Build JAR
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: JAR ans GitHub Release hängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" target/*.jar --clobber

  # Baut das Image unter der Versionsnummer (z. B. 0.1.0). Das "latest"-Tag
  # pflegt weiterhin docker-publish.yml bei jedem main-Push.
  publish-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummer aus Tag ableiten
        id: v
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push versioniertes Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
