name: Release

# release-please observes the Conventional Commits on main and continuously
# maintains a "Release PR" (version bump in pom.xml + CHANGELOG.md).
# Only when this PR is merged, the tag + GitHub Release are created - after that
# the publish jobs build the JAR or the versioned Docker image.
on:
  push:
    branches:
      - main

permissions:
  contents: write        # Create tags & releases
  pull-requests: write   # Create/update release PR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Reads release-please-config.json + .release-please-manifest.json.
      - uses: googleapis/release-please-action@v5
        id: rp

  # Runs only if the release PR has been merged and a release has been created.
  # (Triggered in the same workflow run - therefore the GITHUB_TOKEN lock
  #  against cascading tag events does not apply, no PAT is needed).
  publish-jar:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Build JAR
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Attach JAR to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" target/*.jar --clobber

  # Builds the image under the version number (e.g. 0.1.0). The "latest" tag
  # is still maintained by docker-publish.yml on every main push.
  publish-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version number from tag
        id: v
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max