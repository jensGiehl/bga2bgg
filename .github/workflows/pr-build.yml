name: PR Build & Test

# Runs on every pull request against main/master. This is the check that
# branch protection requires before a PR (including Dependabot PRs) can merge.
on:
  pull_request:
    branches:
      - main
      - master

# A newer push to the same PR supersedes an in-flight run.
concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      # Compiles the application and runs the tests.
      - name: Build & test
        run: ./mvnw --batch-mode --no-transfer-progress verify
